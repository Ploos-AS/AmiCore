name: M1.20 Indexed Effective Address
on:
  push:
  pull_request:
jobs:
  qualify-indexed-ea:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Qualify indexed effective-address primitive
        run: |
          iverilog -g2012 -o /tmp/m1_20_indexed rtl/amcore_ea.sv sim/tb_m1_20_indexed_ea.sv
          vvp /tmp/m1_20_indexed
