name: RTL

on:
  push:
  pull_request:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Compile SystemVerilog sources
        run: >-
          iverilog -g2012
          -o /tmp/amcore-m1.vvp
          rtl/amcore_placeholder.sv
          rtl/amcore_bus_if.sv
          rtl/amcore_cpu_if.sv
          rtl/amcore_memory_if.sv
          rtl/amcore_68k_baseline.sv
          sim/tb_m1_interfaces.sv
      - name: Run M1 deterministic simulation
        run: vvp /tmp/amcore-m1.vvp
      - name: Compile and run 68000 baseline
        run: >-
          iverilog -g2012 -s tb_68k_baseline
          -o /tmp/amcore-68k.vvp
          rtl/amcore_68k_baseline.sv
          sim/tb_68k_baseline.sv
          && vvp /tmp/amcore-68k.vvp
