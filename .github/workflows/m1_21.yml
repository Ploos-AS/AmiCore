name: M1.21 MOVE Data Effective Address
on:
  push:
  pull_request:
jobs:
  qualify-move-data-ea:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Qualify MOVE.L source effective addresses
        run: |
          iverilog -g2012 -o /tmp/m1_21_move rtl/amcore_68k_baseline.sv sim/tb_m1_21_move_source_ea.sv
          vvp /tmp/m1_21_move
      - name: Qualify MOVEA.L source effective addresses
        run: |
          iverilog -g2012 -o /tmp/m1_21_movea rtl/amcore_68k_baseline.sv sim/tb_m1_21_movea_source_ea.sv
          vvp /tmp/m1_21_movea
