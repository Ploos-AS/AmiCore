name: M1.15 Condition Codes
on:
  push:
    branches: [main]
  pull_request:
jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Qualify condition truth table and Scc values
        run: |
          iverilog -g2012 -o /tmp/m1_15_condition rtl/amcore_condition.sv sim/tb_m1_15_condition.sv
          vvp /tmp/m1_15_condition
      - name: Qualify DBcc execution semantics
        run: |
          iverilog -g2012 -o /tmp/m1_15_dbcc rtl/amcore_dbcc.sv sim/tb_m1_15_dbcc.sv
          vvp /tmp/m1_15_dbcc
      - name: Qualify Scc Dn register execution semantics
        run: |
          iverilog -g2012 -o /tmp/m1_15_scc rtl/amcore_scc_reg.sv sim/tb_m1_15_scc_reg.sv
          vvp /tmp/m1_15_scc
      - name: Qualify CPU DBcc/Scc integration
        run: |
          iverilog -g2012 -o /tmp/m1_15_cpu rtl/amcore_68k_baseline.sv sim/tb_m1_15_cpu_dbcc_scc.sv
          vvp /tmp/m1_15_cpu
